services:
  db:
    image: postgres:18-alpine
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: coaster
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U admin -d coaster']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    ports:
      - '6379:6379'
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile.dev
    # A database with no tables in it looks exactly like broken code: every request dies on
    # Prisma and the browser is told "Internal server error", login included. Nothing used to
    # apply the migrations, so a fresh volume —a first checkout, or the drop that the move to
    # postgres:18 asks for— left the API talking to an empty schema. Now the container applies
    # them before it serves. `deploy` and not `dev`: it only ever plays the migrations that are
    # already committed, never writes one and never resets anybody's local data.
    # `exec` so the dev server is the process the container signals: without it a stop waits
    # out its ten seconds and kills the shell instead.
    command: ['sh', '-c', 'npx prisma migrate deploy && exec npm run dev']
    ports:
      - '3000:3000'
    environment:
      - DATABASE_URL=postgres://admin:admin@db:5432/coaster
      - REDIS_URL=redis://redis:6379
      - TRUST_PROXY_HOPS=0
      - BETA_ALLOWLIST_ENABLED=${BETA_ALLOWLIST_ENABLED:-false}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./:/app
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/packages/common/node_modules

  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile.dev
    ports:
      - '4200:4200'
    environment:
      - API_URL=http://localhost:3000
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
    depends_on:
      api:
        condition: service_started
    volumes:
      - ./:/app
      - /app/node_modules
      - /app/apps/web/node_modules
      - /app/packages/common/node_modules
      - web_angular_cache:/app/apps/web/.angular

  stripe:
    image: stripe/stripe-cli:latest
    env_file:
      - ./apps/api/.env
    entrypoint: /bin/sh
    command:
      - -c
      - >-
        exec stripe listen --api-key "$${STRIPE_SECRET_KEY}"
        --forward-to http://api:3000/api/v1/stripe/webhook
    depends_on:
      api:
        condition: service_started

volumes:
  postgres_data:
  web_angular_cache:
