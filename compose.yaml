services:
  db:
    image: postgres:18-alpine
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: coaster
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U admin -d coaster']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    ports:
      - '6379:6379'
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  firebase:
    build:
      context: ./apps/firebase
      dockerfile: Dockerfile
    ports:
      - '9099:9099'
      - '4000:4000'
    volumes:
      - ./apps/firebase:/app
      - /app/node_modules

  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile.dev
    ports:
      - '3000:3000'
    environment:
      - DATABASE_URL=postgres://admin:admin@db:5432/coaster
      - FIREBASE_AUTH_EMULATOR_HOST=firebase:9099
      - REDIS_URL=redis://redis:6379
      - TRUST_PROXY_HOPS=0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      firebase:
        condition: service_started
    volumes:
      - ./:/app
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/packages/common/node_modules

  api-2:
    profiles: ['cluster']
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile.dev
    ports:
      - '3001:3000'
    environment:
      - DATABASE_URL=postgres://admin:admin@db:5432/coaster
      - FIREBASE_AUTH_EMULATOR_HOST=firebase:9099
      - REDIS_URL=redis://redis:6379
      - TRUST_PROXY_HOPS=0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      firebase:
        condition: service_started
    volumes:
      - ./:/app
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/packages/common/node_modules

  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile.dev
    ports:
      - '4200:4200'
    environment:
      - API_URL=http://localhost:3000
    depends_on:
      api:
        condition: service_started
      firebase:
        condition: service_started
    volumes:
      - ./:/app
      - /app/node_modules
      - /app/apps/web/node_modules
      - /app/packages/common/node_modules
      - web_angular_cache:/app/apps/web/.angular

  stripe:
    image: stripe/stripe-cli:latest
    env_file:
      - ./apps/api/.env
    entrypoint: /bin/sh
    command:
      - -c
      - >-
        exec stripe listen --api-key "$${STRIPE_SECRET_KEY}"
        --forward-to http://api:3000/api/v1/stripe/webhook
    depends_on:
      api:
        condition: service_started

volumes:
  postgres_data:
  web_angular_cache:
