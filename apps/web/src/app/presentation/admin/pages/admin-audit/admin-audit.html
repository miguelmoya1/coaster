<coaster-page-header [title]="'admin.audit.title' | translate" [subtitle]="'admin.audit.subtitle' | translate">
  <button actions mat-stroked-button type="button" [disabled]="isLoading()" (click)="reload()">
    <mat-icon>refresh</mat-icon>
    {{ 'common.refresh' | translate }}
  </button>
</coaster-page-header>

<div class="flex flex-col gap-4">
  <section class="flex flex-wrap items-center gap-2">
    @for (actionFilter of actionFilters; track actionFilter ?? 'all') {
      <button
        type="button"
        class="px-3 py-1.5 rounded-full text-sm border transition-colors"
        [class]="
          action() === actionFilter
            ? 'border-primary bg-primary/10 text-primary font-semibold'
            : 'border-outline-variant text-on-surface-variant hover:bg-surface-container'
        "
        [attr.aria-pressed]="action() === actionFilter"
        (click)="selectAction(actionFilter)"
      >
        {{ filterLabel(actionFilter) | translate }}
      </button>
    }

    @if (hasFilters()) {
      <button mat-button type="button" (click)="clearFilters()">
        {{ 'admin.bars.clear_filters' | translate }}
      </button>
    }
  </section>

  @if (isLoading() && !hasLoaded()) {
    <coaster-loading [text]="'common.loading' | translate" containerClasses="min-h-[300px]" />
  } @else {
    <section class="bg-surface-container rounded-2xl border border-outline-variant/50 p-5 flex flex-col gap-3">
      <coaster-audit-list [entries]="entries()" />

      @if (total() > pageSize) {
        <coaster-admin-pagination
          [page]="page()"
          [pageSize]="pageSize"
          [total]="total()"
          [totalPages]="totalPages()"
          (pageChange)="goToPage($event)"
        />
      }
    </section>
  }
</div>
