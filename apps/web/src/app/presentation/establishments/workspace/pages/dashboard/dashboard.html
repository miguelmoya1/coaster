<coaster-page-container>
  <coaster-page-header [title]="'nav.dashboard' | translate" [subtitle]="subtitleKey() | translate" />

  <div class="flex flex-col gap-8" data-testid="dashboard-page">
    @for (widget of widgets(); track widget.component) {
      <ng-container *ngComponentOutlet="widget.component; inputs: widget.inputs" />
    }
  </div>
</coaster-page-container>
