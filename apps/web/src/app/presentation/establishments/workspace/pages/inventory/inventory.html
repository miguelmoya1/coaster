<coaster-page-container>
  <coaster-page-header [title]="'nav.inventory' | translate" [subtitle]="'inventory.inventory_title' | translate">
    @if (canManageMenu()) {
      <button actions mat-stroked-button [routerLink]="['menu']">
        <mat-icon>restaurant_menu</mat-icon>
        <span>{{ 'menu.title' | translate }}</span>
      </button>
    }
    @if (canImportCatalogue()) {
      <button actions mat-flat-button [routerLink]="['import']">
        <mat-icon>download</mat-icon>
        <span>{{ 'inventory.import_title' | translate }}</span>
      </button>
    }
  </coaster-page-header>

  <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 sm:gap-4 mb-6">
    <coaster-stat-card class="flex-1" [label]="'inventory.total' | translate" [value]="counts().total" size="large" />
    <coaster-stat-card
      class="flex-1"
      [label]="'inventory.critical' | translate"
      [value]="counts().critical"
      tone="error"
      size="large"
    />
    <coaster-stat-card
      class="flex-1"
      [label]="'inventory.alerts' | translate"
      [value]="counts().low"
      tone="tertiary"
      size="large"
    />
  </div>

  <div class="mb-4 w-full">
    <coaster-inventory-search [query]="searchQuery()" (queryChange)="searchQuery.set($event)" />
  </div>

  <div class="mb-4 overflow-hidden">
    <coaster-category-filter
      [categories]="categoryList()"
      [(selectedCategoryId)]="selectedCategoryId"
      [editable]="canUpdateCategory()"
      (editCategoryClicked)="onEditCategoryClicked($event)"
    />
  </div>

  <coaster-resource-status [resource]="[products(), categories()]" />

  <div class="flex flex-col gap-4">
    @for (product of filteredProducts(); track product.id) {
      <coaster-inventory-item-card
        [establishmentId]="establishmentId()"
        [itemName]="product.name"
        [qty]="product.currentStock"
        [price]="grossOf(product)"
        [imageUrl]="product.imageUrl"
        [icon]="product.icon || 'inventory_2'"
        [statusLevel]="product.stockStatus"
        [showEditButton]="canUpdateProduct()"
        (click)="onProductClicked(product)"
        (editClicked)="onEditProductClicked(product)"
        (deleteClicked)="handleDeleteProductClicked(product)"
      />
    } @empty {
      @if (products().hasValue()) {
        <div class="text-center text-on-surface-variant mt-10">{{ 'inventory.empty' | translate }}</div>
      }
    }
  </div>

  @if (canCreateProduct()) {
    <coaster-fab
      data-testid="create-inventory-fab"
      coasterRequireSubscription
      [establishmentId]="establishmentId()"
      (click)="onCreateInventoryClicked()"
    />
  }
</coaster-page-container>
