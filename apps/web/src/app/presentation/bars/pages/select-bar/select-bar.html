<coaster-page-container size="sm">
  <coaster-page-header [title]="'bars.select.title' | translate" [subtitle]="'bars.select.subtitle' | translate">
    <button actions mat-flat-button data-testid="create-bar-btn" (click)="navigateToCreate()">
      <mat-icon>add_circle</mat-icon>
      <span>{{ 'common.create' | translate }}</span>
    </button>
  </coaster-page-header>

  @if (bars.isLoading()) {
    <coaster-loading />
  }

  @if (bars.hasValue()) {
    <div class="flex flex-col gap-3">
      @for (bar of bars.value(); track bar.id) {
        <coaster-bar-card [bar]="bar" (click)="selectBar(bar.id)" />
      } @empty {
        <div
          class="flex flex-col items-center justify-center p-8 bg-surface-container rounded-xl border border-dashed border-outline-variant text-center gap-3"
        >
          <span data-testid="empty-bars-message" class="text-on-surface-variant font-medium">
            {{ 'bars.select.empty' | translate }}
          </span>
        </div>
      }
    </div>
  }
</coaster-page-container>
