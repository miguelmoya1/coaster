name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - dev
  pull_request:

permissions:
  contents: 'read'
  id-token: 'write'

env:
  GCP_REGION_SERVICE: 'europe-west1'
  GCP_REGION_JOB: 'europe-southwest1'
  GCP_IMAGE_NAME: 'europe-west1-docker.pkg.dev/coaster-437f2/coaster-repo/api-new'

jobs:
  build-and-test:
    name: 🧪 Tests & Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🗄️ Generate Prisma Client
        run: npm run db:gen -w apps/api

      - name: 🏗️ Build All (Common, API, Web)
        run: |
          npm run build -w @coaster/common
          npm run build -w @coaster/api
          npm run build -w @coaster/web

      - name: 🏗️ The production bundle must build, budgets included
        working-directory: apps/web
        env:
          PRODUCTION: 'true'
        run: |
          node set-env.ts
          npx ng build

      - name: 🧹 Lint
        run: npm run lint

      - name: 🧪 Unit Tests
        run: npm run test

      - name: 🧪 Backend E2E Tests
        run: npm run test:e2e -w @coaster/api

      #      - name: 🌐 Install Playwright Browsers
      #        run: npx playwright install --with-deps
      #        working-directory: apps/web
      #
      #      - name: 🧪 Frontend E2E Tests
      #        run: npx playwright test
      #        working-directory: apps/web

      - name: 🐹 Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: apps/printer-service/go.sum

      - name: 🧪 Go Unit Tests (Printer Service)
        run: cd apps/printer-service && go test -v ./... -cover

  deploy-backend:
    name: 🚀 Deploy Backend & Migrate DB
    needs: build-and-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'api-production' || 'api-beta' }}
    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v4

      - name: 🔎 The target environment must be configured
        env:
          GCP_SERVICE_NAME: ${{ vars.GCP_SERVICE_NAME }}
          GCP_JOB_NAME: ${{ vars.GCP_JOB_NAME }}
          GCP_SECRET_PREFIX: ${{ vars.GCP_SECRET_PREFIX }}
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
        run: |
          for name in GCP_SERVICE_NAME GCP_JOB_NAME GCP_SECRET_PREFIX PUBLIC_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::${name} is empty. Set it on the '${{ github.ref_name == 'main' && 'api-production' || 'api-beta' }}' GitHub environment."
              exit 1
            fi
          done

      - name: 🔐 Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/774617138158/locations/global/workloadIdentityPools/github/providers/my-repo'
          service_account: 'github-actions@coaster-437f2.iam.gserviceaccount.com'

      - name: ☁️ Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # Credentials live in Secret Manager, one copy per environment, and the deploy only ever
      # carries their names. Each secret is its variable in kebab-case behind the environment's
      # prefix, so AUTH_JWT_SECRET in beta is coaster-beta-auth-jwt-secret and the mapping needs
      # no table to maintain. Missing a required one fails here, before the image is built and
      # long before a revision could come up without it.
      - name: 🔑 Resolve the Secret Manager mapping
        env:
          SECRET_PREFIX: ${{ vars.GCP_SECRET_PREFIX }}
        run: |
          required='DATABASE_URL AUTH_JWT_SECRET PRINTER_JWT_SECRET STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET RESEND_API_KEY'
          optional='AI_GATEWAY_API_KEY REDIS_URL'

          present=$(gcloud secrets list --format='value(name.basename())')

          mapping=''
          missing=''

          for name in $required $optional; do
            secret="${SECRET_PREFIX}-$(printf '%s' "$name" | tr 'A-Z_' 'a-z-')"

            if printf '%s\n' "$present" | grep -qx "$secret"; then
              mapping="${mapping:+$mapping,}${name}=${secret}:latest"
              continue
            fi

            case " $required " in
              *" $name "*)
                missing="${missing} ${secret}"
                ;;
              *)
                # Beta is allowed to run without a cache and without the assistant.
                echo "::notice::no ${secret} in Secret Manager; the API runs without ${name}"
                ;;
            esac
          done

          if [ -n "$missing" ]; then
            echo "::error::missing in Secret Manager:${missing} — create them with scripts/secrets-bootstrap.sh, see docs/operations/secrets.md"
            exit 1
          fi

          echo "API_SECRETS=${mapping}" >> "$GITHUB_ENV"
          echo "Wiring ${mapping}"

      - name: 🔑 Configure Docker
        run: gcloud auth configure-docker ${{ env.GCP_REGION_SERVICE }}-docker.pkg.dev

      - name: 🛠️ Build & Push Docker Image
        run: |
          docker build -t ${{ env.GCP_IMAGE_NAME }}:${{ github.sha }} -f apps/api/Dockerfile .
          docker push ${{ env.GCP_IMAGE_NAME }}:${{ github.sha }}

      - name: 🗄️ Run Prisma Migrations (Cloud Run Job)
        run: |
          gcloud run jobs deploy ${{ vars.GCP_JOB_NAME }} \
            --image ${{ env.GCP_IMAGE_NAME }}:${{ github.sha }} \
            --region ${{ env.GCP_REGION_JOB }} \
            --update-secrets="DATABASE_URL=${{ vars.GCP_SECRET_PREFIX }}-database-url:latest" \
            --command "npx,prisma,migrate,deploy,--config=apps/api/prisma.config.ts"

          gcloud run jobs execute ${{ vars.GCP_JOB_NAME }} --region ${{ env.GCP_REGION_JOB }} --wait

      - name: 🌐 Deploy API to Cloud Run Service
        run: |
          gcloud run deploy ${{ vars.GCP_SERVICE_NAME }} \
            --image ${{ env.GCP_IMAGE_NAME }}:${{ github.sha }} \
            --region ${{ env.GCP_REGION_SERVICE }} \
            --update-env-vars="PUBLIC_URL=${{ vars.PUBLIC_URL }}" \
            --update-secrets="${API_SECRETS}" \
            --timeout=3600 \
            --allow-unauthenticated
